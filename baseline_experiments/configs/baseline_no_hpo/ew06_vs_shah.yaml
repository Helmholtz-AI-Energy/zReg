# Baseline full eval pipeline (no HPO) — Kobitski ew_06 (source) vs Shah
# sample-1 (target). Alignment + label transfer, config default_params only —
# no optimizer run, no best_params.json anywhere in this run's output_dir.
#
# F1 is unavailable here: the receiver (Kobitski) has no ground-truth class labels, so f1 is
# zero-filled and its metric weight is 0.0 (Phase 63 D-05).
data_path: data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
max_points_per_frame: 1000  # spatial subsampling - calibrated together with step to fit a ~3-5h total suite runtime, see README.md Runtime section
target_data_path: data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
target_data_format: csv
pipeline_mode: paired
label_source: "target"  # Shah provides the 3-class germ-layer labels; Kobitski (unlabeled) receives them
tier: dev
run_alignment: true
run_label_transfer: true
default_params:
  window_size: 10  # was 60 - too large relative to the 47 strided frames (step=8 below); would degenerate to an unwindowed full sweep
  step: 8  # temporal downsampling, matches the 5 optimize configs - see README.md Runtime section
  cpd_penalty: "rigid"
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.5
  method: knn_voting
val_split: 0.2
output_dir: baseline_experiments/experiments/baseline_no_hpo/ew06_vs_shah

metric_weights:  # full block: a YAML metric_weights replaces the whole default dict
  chamfer: 0.35
  hausdorff: 0.15
  path_smoothness: 0.10
  temporal_stability: 0.10
  f1: 0.0  # zero-filled in paired label_source=target runs (see header)
  knn_consistency: 0.10
