# Baseline full eval pipeline (combined selfcal + ground_truth params) — Kobitski ew_06 (source)
# vs Shah sample-1 (target). Alignment + label transfer. default_params below are the MERGE
# FALLBACK only — baseline_experiments/scripts/run_all.py overrides them at runtime by merging
# all five HPO sources (selfcal/kobitski_ew06_alignment + selfcal/shah_alignment +
# selfcal/shah_label_transfer + ground_truth/kobitski_ew06 + ground_truth/shah_sample1
# best_params.json) via merge_params.merge_combined_params and passing the merged dict
# directly to EvaluationRunner — no optimizer runs in this stage.
#
# Scientific purpose: test whether averaging selfcal-calibrated params (fixed 20° rotation)
# with ground-truth-calibrated params (random 11.31° rotation, random axis) yields better
# cross-embryo generalisation than either calibration regime alone. Numeric params are the
# arithmetic mean of the two merged calibration estimates; categorical conflicts fall back to
# default_params below.
data_path: data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
max_points_per_frame: 1000  # spatial subsampling - calibrated together with step to fit a ~3-5h total suite runtime, see README.md Runtime section
target_data_path: data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
target_data_format: csv
pipeline_mode: paired
tier: dev
n_trials: 50  # inert at tier=dev (dev tier fixes 20 trials via optimizer.py DEV_N_TRIALS); kept for when tier is raised to full
search_strategy: sobol
n_synthetic: 0

search_space:
  cpd_penalty: ["rigid"]  # fixed to rigid — null/affine excluded; see README.md Runtime section
  window_size: [5, 10, 20]
  step: [8]  # single-value list, not a real search - see README.md Runtime section
  dtw_dist_fn: [euclidean, cpd]
  k_neighbours: [3, 5, 10]
  dist_metric: [euclidean]
  smoothing: [0.0, 0.1, 0.3]
  threshold: [0.0, 0.3, 0.5]
  method: ["knn_voting"]  # fixed to knn_voting

run_alignment: true
run_label_transfer: true
default_params:
  window_size: 10  # was 60 - too large relative to the 47 strided frames (step=8 below); would degenerate to an unwindowed full sweep. Only used as merge fallback - see file header.
  step: 8  # temporal downsampling, matches the 5 optimize configs - see README.md Runtime section
  cpd_penalty: "rigid"
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.5
  method: knn_voting
val_split: 0.2
output_dir: baseline_experiments/experiments/baseline_with_combined/ew06_vs_shah

metric_weights:
  chamfer: 0.30
  hausdorff: 0.15
  path_smoothness: 0.10
  temporal_stability: 0.10
  f1: 0.25
  knn_consistency: 0.10
