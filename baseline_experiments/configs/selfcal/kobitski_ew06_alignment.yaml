# Self-calibration (selfcal) — Kobitski embryo ew_06, alignment stage only.
#
# Full-tier variant of configs/selfcal_kobitski.yaml (repo root). Runs the
# sanity -> dev -> full tier ladder (5 -> 20 -> 50 trials) against the real
# Kobitski ew_06 tracklets file, self-registered against a fixed rigid
# perturbation of itself. Produces best_params.json used downstream by the
# "baseline_with_selfcal" pair runs (alignment params only — this run does
# not calibrate label-transfer params, see selfcal/shah_label_transfer.yaml).

data_path: data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
max_points_per_frame: 1000  # spatial subsampling - calibrated together with step to fit a ~3-5h total suite runtime, see README.md Runtime section

run_alignment: true
run_label_transfer: false

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 20.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.1

tier: dev
n_trials: 50  # inert at tier=dev (dev tier fixes 20 trials via optimizer.py DEV_N_TRIALS); kept for when tier is raised to full
search_strategy: sobol
n_synthetic: 0

search_space:
  cpd_penalty: ["rigid"]  # fixed to rigid — null/affine excluded; see README.md Runtime section for nonrigid exclusion reason
  window_size: [5, 10, 20]
  step: [8]  # single-value list, not a real search - see README.md Runtime section: HyperparamOptimizer._objective merges its own hardcoded _default_params (step=1) with the trial's sampled params, so default_params.step alone is silently ignored unless step is also a search_space key
  # single-value list; cosine is not a DTW distance (Phase 63 D-08)
  dtw_dist_fn: [euclidean]

default_params:
  window_size: 10
  step: 8  # fixed temporal downsampling - was searched over [1,2], now fixed & excluded from search_space so every trial gets the full stride benefit (see README.md Runtime section)
  cpd_penalty: "rigid"
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: baseline_experiments/experiments/selfcal/kobitski_ew06_alignment

metric_weights:
  chamfer: 0.40
  hausdorff: 0.20
  path_smoothness: 0.15
  temporal_stability: 0.15
  f1: 0.10
  knn_consistency: 0.00
