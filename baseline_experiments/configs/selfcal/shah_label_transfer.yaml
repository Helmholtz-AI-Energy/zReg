# Self-calibration (selfcal) — Shah sample-1, alignment + label-transfer.
#
# Alignment must run for label transfer to have correspondences to score,
# so run_alignment stays true; the search space is extended with the
# label-transfer knobs (k_neighbours, dist_metric, smoothing, threshold)
# on top of the alignment ones from shah_alignment.yaml. Shah CSV carries a
# per-cell "id" column, giving LabelTransferStage real ground-truth labels.
#
# Full-tier ladder: 5 -> 20 -> 50 trials. Produces best_params.json used
# downstream by "baseline_with_selfcal" pair runs for the label-transfer
# params only (Kobitski selfcal never calibrates label transfer).

data_path: data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
data_format: csv
max_points_per_frame: 1000  # spatial subsampling - calibrated together with step to fit a ~3-5h total suite runtime, see README.md Runtime section

run_alignment: true
run_label_transfer: true

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 15.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.05

tier: dev
n_trials: 50  # inert at tier=dev (dev tier fixes 20 trials via optimizer.py DEV_N_TRIALS); kept for when tier is raised to full
search_strategy: sobol
n_synthetic: 0

search_space:
  cpd_penalty: [null, "rigid", "affine"]  # "nonrigid" excluded - NonRigidCPD.registration() never sets self.transformation in create_pairwise_distance_matrix, crashes every trial that samples it (confirmed via direct testing, see README.md Runtime section)
  window_size: [5, 10, 20]
  step: [8]  # single-value list, not a real search - see README.md Runtime section: HyperparamOptimizer._objective merges its own hardcoded _default_params (step=1) with the trial's sampled params, so default_params.step alone is silently ignored unless step is also a search_space key
  dtw_dist_fn: [euclidean, cosine]
  k_neighbours: [3, 5, 10]
  dist_metric: [euclidean, cosine]
  smoothing: [0.0, 0.1, 0.3]
  threshold: [0.0, 0.3, 0.5]

default_params:
  window_size: 10
  step: 8  # fixed temporal downsampling - was searched over [1,2], now fixed & excluded from search_space so every trial gets the full stride benefit (see README.md Runtime section)
  cpd_penalty: null  # must be null/str — AlignmentStage.VALID_CPD rejects float 1.0
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: baseline_experiments/experiments/selfcal/shah_label_transfer

metric_weights:
  chamfer: 0.30
  hausdorff: 0.15
  path_smoothness: 0.10
  temporal_stability: 0.10
  f1: 0.25
  knn_consistency: 0.10
