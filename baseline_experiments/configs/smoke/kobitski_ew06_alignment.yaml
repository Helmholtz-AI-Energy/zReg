# Smoke config for Phase 51 ENV-03 validation.
# Copy of configs/selfcal/kobitski_ew06_alignment.yaml with four overrides:
#   tier: sanity  (was: dev)
#   n_trials: 2   (was: 50)
#   search_strategy: sobol  (unchanged from source, but comment added — see below)
#   output_dir: baseline_experiments/experiments/smoke/kobitski_ew06_alignment  (was: selfcal/)
# Use with baseline_experiments/scripts/launch_horeka_smoke.sbatch only.

data_path: data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
max_points_per_frame: 1000  # spatial subsampling - calibrated together with step to fit a ~3-5h total suite runtime, see README.md Runtime section

run_alignment: true
run_label_transfer: false

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 20.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.1

tier: sanity  # 5 fixed trials via SANITY_N_TRIALS constant — fastest smoke path
n_trials: 2  # inert at tier=sanity; carried to signal smoke intent
search_strategy: sobol  # MUST remain sobol: auto resolves to propulate when SLURM_JOB_ID is set, deadlocks single-rank job
n_synthetic: 0

search_space:
  cpd_penalty: [null, "rigid", "affine"]  # "nonrigid" excluded - NonRigidCPD.registration() never sets self.transformation in create_pairwise_distance_matrix, crashes every trial that samples it (confirmed via direct testing, see README.md Runtime section)
  window_size: [5, 10, 20]
  step: [8]  # single-value list, not a real search - see README.md Runtime section: HyperparamOptimizer._objective merges its own hardcoded _default_params (step=1) with the trial's sampled params, so default_params.step alone is silently ignored unless step is also a search_space key
  # single-value list; cosine is not a DTW distance (Phase 63 D-08)
  dtw_dist_fn: [euclidean]

default_params:
  window_size: 10
  step: 8  # fixed temporal downsampling - was searched over [1,2], now fixed & excluded from search_space so every trial gets the full stride benefit (see README.md Runtime section)
  cpd_penalty: null  # must be null/str not float — AlignmentStage.VALID_CPD accepts (null, "rigid", "affine", "nonrigid")
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: baseline_experiments/experiments/smoke/kobitski_ew06_alignment  # separate from selfcal outputs

metric_weights:
  chamfer: 0.40
  hausdorff: 0.20
  path_smoothness: 0.15
  temporal_stability: 0.15
  f1: 0.10
  knn_consistency: 0.00
