# HoreKa cluster variant of configs/baseline_no_hpo/ew08_vs_shah.yaml. No search_strategy field (eval-only, no HPO). Exact copy.
# Baseline full eval pipeline (no HPO) — Kobitski ew_08 (source) vs Shah
# sample-1 (target). Alignment + label transfer, config default_params only —
# no optimizer run, no best_params.json anywhere in this run's output_dir.
data_path: data/external/sample/kobitski_data/12_11_27_embryo_ew_08_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
max_points_per_frame: 1000  # spatial subsampling - calibrated together with step to fit a ~3-5h total suite runtime, see README.md Runtime section
device: "cuda"  # GPU-03: GPU tensor placement for HoreKa runs
target_data_path: data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
target_data_format: csv
pipeline_mode: paired
label_source: "target"  # Shah provides the 3-class germ-layer labels; Kobitski (unlabeled) receives them
tier: dev
run_alignment: true
run_label_transfer: true
default_params:
  window_size: 10  # was 60 - too large relative to the 47 strided frames (step=8 below); would degenerate to an unwindowed full sweep
  step: 8  # temporal downsampling, matches the 5 optimize configs - see README.md Runtime section
  cpd_penalty: "rigid"
  dtw_dist_fn: cpd
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.5
  method: knn_voting
val_split: 0.2
output_dir: baseline_experiments/experiments/baseline_no_hpo/ew08_vs_shah
