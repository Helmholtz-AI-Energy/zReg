# Sanity-tier smoke variant of configs_horeka/selfcal/shah_alignment.yaml.
# Used ONLY by launch_horeka_multirank_test.sbatch to validate propulate rank
# coordination cheaply (5 trials, ~minutes). Output goes to smoke/ so it does
# not overwrite the selfcal/shah_alignment best_params.json the full run needs.
data_path: data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
data_format: csv
max_points_per_frame: 1000
device: "cuda"

run_alignment: true
run_label_transfer: false

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 15.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.05

tier: sanity  # 5 fixed trials — fast multirank validation only
n_trials: 50  # inert at tier=sanity
search_strategy: auto
n_synthetic: 0

search_space:
  cpd_penalty: [null, "rigid", "affine"]
  window_size: [5, 10, 20]
  step: [8]
  dtw_dist_fn: [euclidean, cosine]

default_params:
  window_size: 10
  step: 8
  cpd_penalty: 1.0
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: baseline_experiments/experiments/smoke/shah_alignment

metric_weights:
  chamfer: 0.40
  hausdorff: 0.20
  path_smoothness: 0.15
  temporal_stability: 0.15
  f1: 0.10
  knn_consistency: 0.00
