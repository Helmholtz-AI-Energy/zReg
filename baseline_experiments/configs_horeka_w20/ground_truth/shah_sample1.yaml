# window_size=20-only variant of configs_horeka/ground_truth/shah_sample1.yaml.
# Run via launch_horeka_w20.sbatch after the main job (configs_horeka) completes.

data_path: data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
data_format: csv
max_points_per_frame: 1000
device: "cuda"

run_alignment: true
run_label_transfer: true

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 28.71
  rotation_axis: [0.933, -0.13, 0.589]
  sigma: 0.0883

tier: dev
n_trials: 50
search_strategy: auto
n_synthetic: 0

search_space:
  cpd_penalty: ["rigid"]  # fixed to rigid — null/affine excluded
  window_size: [20]
  step: [8]
  dtw_dist_fn: [euclidean, cosine]
  k_neighbours: [3, 5, 10]
  dist_metric: [euclidean, cosine]
  smoothing: [0.0, 0.1, 0.3]
  threshold: [0.0, 0.3, 0.5]
  method: ["knn_voting"]  # fixed to knn_voting

default_params:
  window_size: 20
  step: 8
  cpd_penalty: "rigid"
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: baseline_experiments/experiments/ground_truth/shah_sample1_w20

metric_weights:
  chamfer: 0.30
  hausdorff: 0.15
  path_smoothness: 0.10
  temporal_stability: 0.10
  f1: 0.25
  knn_consistency: 0.10
