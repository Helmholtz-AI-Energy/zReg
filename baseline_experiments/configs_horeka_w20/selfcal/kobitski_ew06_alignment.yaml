# window_size=20-only variant of configs_horeka/selfcal/kobitski_ew06_alignment.yaml.
# Run via launch_horeka_w20.sbatch after the main job (configs_horeka) completes.
# window_size=20 produces ~1067 pairwise iterations vs 47 for window_size=5 —
# isolated here so slow w=20+CPD trials don't cause the main job to time out.

data_path: data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
max_points_per_frame: 1000
device: "cuda"

run_alignment: true
run_label_transfer: false

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 20.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.1

tier: dev
n_trials: 50
search_strategy: auto
n_synthetic: 0

search_space:
  cpd_penalty: ["rigid"]  # fixed to rigid — null/affine excluded
  window_size: [20]  # only w=20 — slower trials separated from main job
  step: [8]
  # single-value list; cosine is not a DTW distance (Phase 63 D-08)
  dtw_dist_fn: [euclidean]

default_params:
  window_size: 20
  step: 8
  cpd_penalty: "rigid"
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: baseline_experiments/experiments/selfcal/kobitski_ew06_alignment_w20

metric_weights:
  chamfer: 0.40
  hausdorff: 0.20
  path_smoothness: 0.15
  temporal_stability: 0.15
  f1: 0.10
  knn_consistency: 0.00
