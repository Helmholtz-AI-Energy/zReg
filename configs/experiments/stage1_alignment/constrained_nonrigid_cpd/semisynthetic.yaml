# Stage 1 — Alignment: Constrained Non-rigid CPD.
# Tier 2 — Semi-synthetic: noise-augmented real data (sigma=1.0) + mild rigid transform.
# NOTE: ConstrainedNonRigidCPD exists in zreg.cpd but is not yet wired into
# AlignmentStage.VALID_CPD. Before running, add "constrained_nonrigid" to
# VALID_CPD in eval/stages/alignment.py and add dispatch in _build_aligned_cloud.
# Run: python run_eval.py --config <this> --mode full
data_path: data/synthetic/semi_synthetic/kobitski_ew06_noise_sigma1.0/kobitski_ew06_noise_sigma1.0.csv
data_format: csv
pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 15.0
  rotation_axis: [0, 0, 1]
run_alignment: true
run_label_transfer: false
tier: dev
n_trials: 20
search_strategy: auto
sobol_seed: 42
search_space:
  window_size: [10, 20, 30]
default_params:
  window_size: 20
  step: 2
  cpd_penalty: constrained_nonrigid
  dtw_dist_fn: cpd
  n_breakpoints: 5
output_dir: experiments/runs/stage1_alignment/constrained_nonrigid_cpd/semisynthetic
save_plots: true
verbose: false
