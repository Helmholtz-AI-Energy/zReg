# Stage 1 — Alignment: Constrained Non-rigid CPD.
# Tier 1 — Fully synthetic: known-GT bowl/ball data for HPO.
# NOTE: ConstrainedNonRigidCPD exists in zreg.cpd but is not yet wired into
# AlignmentStage.VALID_CPD. Before running, add "constrained_nonrigid" to
# VALID_CPD in eval/stages/alignment.py and add dispatch in _build_aligned_cloud.
# Run: python run_eval.py --config <this> --mode full
data_path: data/synthetic/fully_synthetic/ball_realistic_kobitski.csv
data_format: csv
pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 30.0
  rotation_axis: [0, 0, 1]
run_alignment: true
run_label_transfer: false
tier: full
n_trials: 50
search_strategy: auto
sobol_seed: 42
search_space:
  window_size: [10, 20, 30]
default_params:
  window_size: 20
  step: 2
  cpd_penalty: constrained_nonrigid
  dtw_dist_fn: cpd
  n_breakpoints: 5
output_dir: experiments/runs/stage1_alignment/constrained_nonrigid_cpd/synthetic
save_plots: true
verbose: false
