# Stage 2 — Label Transfer: CPD-weighted (label_transfer_method: cpd_weighted).
# Tier 1 — Fully synthetic: known-GT bowl/ball data for HPO.
# Alignment uses best non-rigid CPD params from Stage 1.
# Run: python run_eval.py --config <this> --mode full
#
# GT-03 audit note (Phase 56): this config's data_path
# (ball_realistic_kobitski.csv) has a "label" column that is currently a
# constant placeholder — every point is assigned label=1 by
# scripts/generate_datasets.py:239 (_make_trajectory). Under the Phase 56
# ground_truth_field="label" default (D-01), F1 against this ground truth
# is trivially maximizable (single-class target) and is NOT a meaningful
# label-transfer accuracy signal; treat any F1 score from this config as an
# end-to-end pipeline smoke-test signal only. Wiring a real multi-class
# label source (generate_labels()) was considered and deliberately
# deferred — risk of per-frame temporal-labeling incoherence from
# generate_labels()'s independently-randomized per-frame Voronoi
# partitions, and scope overlap with Phase 57's generation-mechanism
# territory (CONTEXT.md Claude's Discretion).
data_path: data/synthetic/fully_synthetic/ball_realistic_kobitski.csv
data_format: csv
pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 30.0
  rotation_axis: [0, 0, 1]
run_alignment: true
run_label_transfer: true
label_transfer_method: cpd_weighted
tier: full
n_trials: 50
search_strategy: auto
sobol_seed: 42
search_space:
  window_size: [10, 20, 30]
default_params:
  window_size: 20
  step: 2
  cpd_penalty: nonrigid
  dtw_dist_fn: cpd
  n_breakpoints: 5
  threshold: 0.5
output_dir: experiments/runs/stage2_label_transfer/cpd_weighted/synthetic
save_plots: true
verbose: false
