# Stage 2 — Label Transfer: kNN voting (label_transfer_method: knn_voting).
# Tier 2 — Semi-synthetic: noise-augmented real data (sigma=1.0) + mild rigid transform.
# Alignment uses best non-rigid CPD params from Stage 1.
# Run: python run_eval.py --config <this> --mode full
data_path: data/synthetic/semi_synthetic/kobitski_ew06_noise_sigma1.0/kobitski_ew06_noise_sigma1.0.csv
data_format: csv
pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 15.0
  rotation_axis: [0, 0, 1]
run_alignment: true
run_label_transfer: true
label_transfer_method: knn_voting
tier: dev
n_trials: 20
search_strategy: auto
sobol_seed: 42
search_space:
  k_neighbours: [3, 5, 10]
  window_size: [10, 20, 30]
default_params:
  window_size: 20
  step: 2
  cpd_penalty: nonrigid
  dtw_dist_fn: cpd
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.5
output_dir: experiments/runs/stage2_label_transfer/knn/semisynthetic
save_plots: true
verbose: false
