# Phase 32 HETERO-01: Kobitski ew06 (tracklets) as source, Shah sample-1 (csv) as target.
# Exercises target_data_format to load a different format for the target dataset.
data_path: /data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets
target_data_path: /data/external/sample/shah_data/sample-1/sample-1-cell-tracks.csv
target_data_format: csv
pipeline_mode: paired
tier: sanity
n_trials: 3
run_alignment: true
run_label_transfer: true
default_params:
  window_size: 60
  step: 1
  cpd_penalty: null
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.5
output_dir: experiments/runs/kobitski_vs_shah
