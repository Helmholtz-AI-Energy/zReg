# Self-registration calibration — Kobitski embryo ew_06
#
# Purpose: first-pass hyperparameter calibration using a known transformation
# as ground truth. Mirror of selfcal_shah.yaml but on tracklets-format Kobitski
# data. Running both lets you compare whether calibrated params generalise across
# data sources before committing to a single search result.
#
# Limitation: optimized params transfer best when the augmentation matches the
# real inter-timepoint difficulty. Validate final params on a true inter-
# timepoint pair before production use.

data_path: data/external/sample/kobitski_data/12_11_15_embryo_ew_06_Cleaned_BackTracked_Oriented.tracklets
data_format: tracklets

# Known rigid transformation applied to produce the "target" for registration.
# Kobitski 3D microscopy data spans a larger spatial range than Shah, so a
# slightly larger rotation (20°) and proportionally larger noise are used.
augmentation_params:
  rotation_deg: 20.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.1

run_alignment: true
run_label_transfer: false   # no labels needed for geometry calibration

pipeline_mode: synthetic
transform_spec:
  type: rigid
  rotation_deg: 20.0
  rotation_axis: [0.0, 0.0, 1.0]
  sigma: 0.1

tier: dev
n_trials: 30
n_synthetic: 0              # use real data only — self-registration, no synthetic frames

search_strategy: bayesian
search_space:
  cpd_penalty: [null, "rigid", "affine", "nonrigid"]
  window_size: [5, 10, 20]
  step: [1, 2]
  # single-value list; cosine is not a DTW distance (Phase 63 D-08)
  dtw_dist_fn: [euclidean]

default_params:
  window_size: 10
  step: 1
  cpd_penalty: 1.0
  dtw_dist_fn: euclidean
  n_breakpoints: 5
  k_neighbours: 5
  dist_metric: euclidean
  smoothing: 0.0
  threshold: 0.0

val_split: 0.2
output_dir: experiments/runs/selfcal_kobitski

metric_weights:
  chamfer: 0.40
  hausdorff: 0.20
  path_smoothness: 0.15
  temporal_stability: 0.15
  f1: 0.10
  knn_consistency: 0.00
